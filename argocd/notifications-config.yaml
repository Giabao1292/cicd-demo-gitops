apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # The actual Slack URL is read from argocd-notifications-secret, never Git.
  service.webhook.slack-webhook: |
    url: $slack-webhook-url
    headers:
      - name: Content-Type
        value: application/json

  template.slack-sync-succeeded: |
    webhook:
      slack-webhook:
        method: POST
        body: |
          {
            "text": ":white_check_mark: Argo CD deployed *{{.app.metadata.name}}* successfully\\nRevision: `{{.app.status.sync.revision}}`\\nHealth: {{.app.status.health.status}}"
          }

  template.slack-sync-failed: |
    webhook:
      slack-webhook:
        method: POST
        body: |
          {
            "text": ":x: Argo CD sync failed for *{{.app.metadata.name}}*\\nPhase: {{.app.status.operationState.phase}}\\nHealth: {{.app.status.health.status}}"
          }

  trigger.on-sync-succeeded-slack: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      oncePer: app.status.sync.revision
      send: [slack-sync-succeeded]

  trigger.on-sync-failed-slack: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      oncePer: app.status.operationState.syncResult.revision
      send: [slack-sync-failed]
